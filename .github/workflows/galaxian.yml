name: Generate Galaxian Contribution Animation

on:
  schedule:
    # 每天午夜 00:00 (UTC) 自動執行一次
    - cron: "0 0 * * *"
  workflow_dispatch: # 支援手動觸發
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate Galaxian animation
        run: |
          python generate_galaxian.py ${{ github.repository_owner }} dist/galaxian.gif

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
